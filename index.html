<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6F4E37">

  <title>MOON CORE PILATES｜線上預約</title>

  <style>

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #F6EFE4;
      color: #4A3B30;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      width: 100%;
      background:
        linear-gradient(
          135deg,
          #6F4E37 0%,
          #5C4033 100%
        );
      color: #FFFFFF;
      padding:
        max(28px, env(safe-area-inset-top))
        24px
        32px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -70px;
      top: -90px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }

    .header::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      left: -70px;
      bottom: -80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
    }

    .header-inner {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
    }

    .header-small {
      color: #EBDCC3;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .header-title {
      margin-top: 7px;
      font-size: clamp(25px, 5vw, 32px);
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .header-sub {
      margin-top: 7px;
      color: #E2D3BC;
      font-size: 12px;
      letter-spacing: 1.5px;
    }

    /* =========================
       CONTAINER
    ========================= */

    .container {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      padding:
        24px 18px
        calc(40px + env(safe-area-inset-bottom));
    }

    /* =========================
       CARD
    ========================= */

    .booking-card {
      background: #FFFFFF;
      border: 1px solid rgba(220, 201, 174, 0.75);
      border-radius: 18px;
      padding: 22px 18px 24px;
      box-shadow: 0 8px 30px rgba(75, 52, 42, 0.08);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #4B342A;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .section-title::before {
      content: "";
      width: 5px;
      height: 23px;
      border-radius: 10px;
      background: #8B5E3C;
    }

    .section-description {
      margin: 0 0 22px 15px;
      color: #85735F;
      font-size: 13px;
      line-height: 1.6;
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
      margin-top: 20px;
    }

    .form-group:first-of-type {
      margin-top: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #8A7260;
      font-size: 14px;
      font-weight: 600;
    }

    select,
    input {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #DCC9AE;
      border-radius: 10px;
      background: #FFFFFF;
      font-family: inherit;
      font-size: 16px;
      color: #4A3B30;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #6F4E37;
      background: #FFFCF7;
      box-shadow: 0 0 0 3px rgba(111, 78, 55, 0.15);
    }

    input::placeholder {
      color: #B8A99A;
    }

    /* =========================
       SELECT
    ========================= */

    select {
      appearance: none;
      -webkit-appearance: none;

      background-image:
        linear-gradient(
          45deg,
          transparent 50%,
          #6F4E37 50%
        ),
        linear-gradient(
          135deg,
          #6F4E37 50%,
          transparent 50%
        );

      background-position:
        calc(100% - 18px) 21px,
        calc(100% - 12px) 21px;

      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 40px;
    }

    /* =========================
       CALENDAR
    ========================= */

    .calendar {
      border: 1px solid #DCC9AE;
      border-radius: 14px;
      padding: 14px;
      background: #FFFFFF;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .calendar-nav {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: #F1E8DA;
      color: #4B342A;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calendar-nav:disabled {
      opacity: .3;
      cursor: not-allowed;
    }

    .calendar-title {
      font-size: 16px;
      font-weight: 800;
      color: #4B342A;
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      color: #85735F;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .calendar-day {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 14px;
      font-family: inherit;
      color: #4A3B30;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .calendar-day.empty {
      cursor: default;
    }

    .calendar-day.disabled {
      color: #D9CFC2;
      cursor: not-allowed;
    }

    .calendar-day.today {
      font-weight: 800;
      color: #6F4E37;
    }

    .calendar-day.selected {
      background: #6F4E37;
      color: #FFFFFF;
      font-weight: 800;
    }

    .calendar-day:not(.disabled):not(.empty):not(.selected):hover {
      background: #F1E8DA;
    }

    .selected-date-label {
      margin-top: 10px;
      font-size: 13px;
      color: #4B342A;
      text-align: center;
    }

    .selected-date-label strong {
      color: #8B5E3C;
    }

    /* =========================
       TIME
    ========================= */

    .time-wrapper {
      margin-top: 20px;
    }

    .times {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
    }

    .time-button {
      width: 100%;
      min-height: 48px;
      border: 1px solid #6F4E37;
      background: #FFFFFF;
      color: #4B342A;
      border-radius: 10px;
      padding: 11px 5px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .time-button.selected {
      background: #6F4E37;
      border-color: #6F4E37;
      color: #FFFFFF;
      box-shadow: 0 4px 10px rgba(111, 78, 55, 0.25);
    }

    .time-button.disabled,
    .time-button:disabled {
      background: #F1ECE4;
      border-color: #E0D6C9;
      color: #B8A99A;
      cursor: not-allowed;
      box-shadow: none;
    }

    .no-time {
      grid-column: 1 / -1;
      padding: 15px 10px;
      border-radius: 10px;
      background: #F8F3EA;
      color: #85735F;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    /* =========================
       SUBMIT
    ========================= */

    .submit {
      display: block;
      width: 100%;
      min-height: 52px;
      margin-top: 28px;
      padding: 14px 18px;
      border: none;
      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #8B5E3C 0%,
          #7A5033 100%
        );

      color: #FFFFFF;
      font-family: inherit;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(139, 94, 60, 0.22);
    }

    .submit:hover {
      background:
        linear-gradient(
          135deg,
          #7A5033 0%,
          #6A4429 100%
        );
    }

    .submit:disabled {
      opacity: .55;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* =========================
       SERVICE NOTE
    ========================= */

    .service-note {
      margin-top: 10px;
      padding: 11px 13px;
      border-radius: 10px;
      background: #F1E8DA;
      border: 1px solid #EADFCB;
      color: #6B5646;
      font-size: 12.5px;
      line-height: 1.75;
    }

    .service-note:empty {
      display: none;
    }

/* =========================
       MESSAGE
    ========================= */

    .message {
      margin-top: 18px;
      color: #4B342A;
      line-height: 1.8;
      font-size: 14px;
    }

    .success {
      padding: 20px 18px;
      margin-top: 0;
      border-radius: 13px;
      background: #FFFCF6;
      border: 1px solid #DCC9AE;
      box-shadow: 0 4px 14px rgba(74, 59, 48, 0.05);
    }

    .success-title {
      color: #4B342A;
      font-size: 20px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 12px;
    }

    .reservation-id {
      display: block;
      width: 100%;
      color: #8B5E3C;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      margin: 5px 0 18px;
    }

    .success-info {
      padding: 14px;
      border-radius: 10px;
      background: #FFFFFF;
      border: 1px solid #EADFCB;
    }

    .success-row {
      padding: 8px 0;
      border-bottom: 1px solid #EFE6D8;
      font-size: 14px;
      line-height: 1.6;
    }

    .success-row:last-child {
      border-bottom: none;
    }

    .success-label {
      color: #85735F;
      font-size: 12px;
      margin-bottom: 2px;
    }

    .success-value {
      color: #4A3B30;
      font-weight: 600;
    }

    .success-notice {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #F1E8DA;
      color: #4B342A;
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
    }

    /* =========================
       LINE STATUS
    ========================= */

    .line-status {
      margin-top: 13px;
      padding: 0 5px;
      font-size: 12px;
      color: #8A7260;
      text-align: center;
      line-height: 1.6;
    }

    .success-status {
      color: #4B342A;
    }

    .error-status {
      color: #B4533C;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .loading-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6F4E37;
      animation: loading 1s infinite ease-in-out;
    }

    .loading-dot:nth-child(2) {
      animation-delay: .15s;
    }

    .loading-dot:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes loading {
      0%,
      60%,
      100% {
        opacity: .3;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    @media (min-width: 600px) {

      .header {
        padding: 36px 32px;
      }

      .container {
        padding: 34px 24px 50px;
      }

      .booking-card {
        padding: 30px;
      }

      .times {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

    }

    @media (min-width: 900px) {

      .header {
        padding: 38px 30px;
      }

      .container {
        padding: 45px 30px 70px;
      }

      .booking-card {
        padding: 34px;
        border-radius: 20px;
      }

      .section-title {
        font-size: 22px;
      }

      .times {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 11px;
      }

      .submit {
        min-height: 56px;
        font-size: 18px;
      }

    }

    @media (max-width: 359px) {

      .header {
        padding-left: 18px;
        padding-right: 18px;
      }

      .container {
        padding: 18px 12px 35px;
      }

      .booking-card {
        padding: 18px 14px 20px;
        border-radius: 15px;
      }

      .section-title {
        font-size: 18px;
      }

      .times {
        gap: 7px;
      }

      .time-button {
        min-height: 45px;
        font-size: 14px;
      }

    }

  </style>

</head>

<body>

<header class="header">

  <div class="header-inner">

    <div class="header-small">
      MOON CORE PILATES
    </div>

    <div class="header-title">
      線上預約
    </div>

    <div class="header-sub">
      ONLINE RESERVATION
    </div>

  </div>

</header>

<main class="container">

  <section class="booking-card">

    <div class="section-title">
      預約課程
    </div>

    <div class="section-description">
      請選擇課程、日期與方便的時間，我們會為您保留預約。每堂 60 分鐘，採預約制。
    </div>

    <div class="form-group">

      <label for="service">
        選擇課程
      </label>

      <select id="service">
        <option value="">讀取課程中...</option>
      </select>

      <div id="serviceNote" class="service-note"></div>

    </div>

    <div class="form-group">

      <label>
        選擇日期
      </label>

      <div id="calendar" class="calendar">
        <div class="no-time">讀取可預約日期...</div>
      </div>

      <div id="selectedDateLabel" class="selected-date-label">
        請點選日期
      </div>

    </div>

    <div class="time-wrapper">

      <label>
        選擇時間
      </label>

      <div id="times" class="times">
        <div class="no-time">
          請先選擇日期
        </div>
      </div>

    </div>

    <div class="form-group">

      <label for="name">
        姓名
      </label>

      <input type="text" id="name" placeholder="請輸入姓名" autocomplete="name">

    </div>

    <div class="form-group">

      <label for="phone">
        電話
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="請輸入聯絡電話"
        autocomplete="tel"
        inputmode="tel"
      >

    </div>

    <!-- 只有「一對二」體驗才會顯示 -->
    <div class="form-group" id="partnerGroup" style="display:none;">

      <label for="partnerName">
        同行夥伴姓名
      </label>

      <input type="text" id="partnerName" placeholder="請輸入一起體驗的夥伴姓名" maxlength="30">

    </div>

    <button id="submitButton" class="submit" type="button">
      確認預約
    </button>

    <div id="message" class="message"></div>

    <div id="lineStatus" class="line-status">
      LINE 初始化中...
    </div>

  </section>

</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script src="config.js"></script>

<script>

  /* ==================================================
     設定值放在 config.js（CONFIG.LIFF_ID / CONFIG.GAS_ENDPOINT），
     換 LIFF App 或重新部署 GAS 時只需要改 config.js。
  ================================================== */

  // 服務名稱以「體驗課」開頭的是首次體驗課（需與後端 CustomLogic.gs 一致）
  const TRIAL_PREFIX = '體驗課';
  const TWO_PERSON_KEYWORD = '一對二';

  const NOTE_TRIAL =
    '體驗課僅限首次預約（新生限定），每人限體驗一次，每堂 60 分鐘。後續預約請選擇正式課程。';

  const NOTE_FORMAL =
    '正式課程不區分器械種類，由老師依個人需求安排核心床、凱迪拉克及其他器械，使用凱迪拉克不另加價。' +
    '已購買課程包的學員，預約時會自動扣抵 1 堂。本工作室沒有儲值金，僅提供包堂方案。';

  let selectedTime = '';
  let selectedDate = '';
  let calendarViewDate = new Date();

  let monthAvailability = {};
  let monthAvailabilityKey = '';
  let monthAvailabilityFailed = false;

  // lineUserId 僅用於畫面判斷，不會傳給後端當作身分依據
  let lineUserId = '';

  // idToken 才是後端會拿去跟 LINE 官方驗證身分的依據
  let lineIdToken = '';

  let liffReady = false;
  let serviceDisabled = false;

  const $ = function (id) { return document.getElementById(id); };

  /* ==================================================
     初始化
  ================================================== */

  window.addEventListener('load', function () {

    initLIFF();
    checkServiceStatus();
    loadServices();

  });

  $('submitButton').addEventListener('click', submitReservation);
  $('service').addEventListener('change', function () { onServiceChange(true); });

  async function checkServiceStatus() {

    try {

      const result = await callGAS('checkStatus', {});

      if (result && result.success && result.active === false) {
        serviceDisabled = true;
        showServiceDisabledOverlay();
      }

    } catch (error) {

      // 查詢失敗不顯示暫停畫面，避免網路問題影響正常客戶
      console.error('checkServiceStatus ERROR:', error);

    }

  }

  /* ==================================================
     課程清單（從「服務項目」工作表讀取）
  ================================================== */

  function isTrial(name) {
    return String(name).indexOf(TRIAL_PREFIX) === 0;
  }

  function shortName(name) {
    return String(name).replace(/^(體驗課|正式課程)[｜|]\s*/, '');
  }

  function formatMoney(n) {
    return '$' + Number(n).toLocaleString('en-US');
  }

  function addServiceGroup(select, label, names, services) {

    if (!names.length) return;

    const group = document.createElement('optgroup');
    group.label = label;

    if (label.indexOf('首次') === 0) group.dataset.trial = '1';

    names.forEach(function (name) {

      const option = document.createElement('option');

      option.value = name;
      option.dataset.price = services[name].price;
      option.textContent = shortName(name) + '｜' + formatMoney(services[name].price);

      group.appendChild(option);

    });

    select.appendChild(group);

  }

  async function loadServices() {

    const select = $('service');

    try {

      const result = await callGAS('getServices', {});

      if (!result || !result.success) {
        throw new Error('讀取課程失敗，請重新整理頁面');
      }

      const services = result.services || {};
      const names = Object.keys(services);

      if (!names.length) {
        throw new Error('目前沒有開放預約的課程');
      }

      select.innerHTML = '';

      addServiceGroup(
        select,
        '首次體驗課（新生限定）',
        names.filter(isTrial),
        services
      );

      addServiceGroup(
        select,
        '正式課程',
        names.filter(function (n) { return !isTrial(n); }),
        services
      );

    } catch (error) {

      console.error('loadServices ERROR:', error);

      select.innerHTML =
        '<option value="">' + escapeHtml(error.message) + '</option>';

    }

    onServiceChange(false);
    applyTrialState();
    renderCalendar();

  }

  /* 體驗課只有首次預約：不是首次的人，體驗課選項直接停用 */
  let trialAllowed = true;

  function applyTrialState() {

    const select = $('service');
    const group = select.querySelector('optgroup[data-trial]');

    if (!group) return;

    group.label = trialAllowed
      ? '首次體驗課（新生限定）'
      : '首次體驗課（僅限首次預約，您已不適用）';

    Array.prototype.forEach.call(group.children, function (option) {
      option.disabled = !trialAllowed;
    });

    if (!trialAllowed && isTrial(select.value)) {

      const next = Array.prototype.find.call(select.options, function (o) {
        return o.value && !o.disabled;
      });

      if (next) select.value = next.value;

      onServiceChange(true);

    }

  }

  async function refreshTrialEligibility() {

    if (!lineIdToken) return;

    try {

      const result = await callGAS('checkTrialEligible', {
        idToken: lineIdToken,
        phone: $('phone').value.trim()
      });

      if (result && result.success) {
        trialAllowed = result.eligible !== false;
        applyTrialState();
      }

    } catch (error) {

      // 查詢失敗不影響預約，送出時後端仍會檢查
      console.error('refreshTrialEligibility ERROR:', error);

    }

  }

  $('phone').addEventListener('blur', refreshTrialEligibility);

  function onServiceChange(reload) {

    const name = $('service').value;

    $('serviceNote').textContent =
      !name ? '' : (isTrial(name) ? NOTE_TRIAL : NOTE_FORMAL);

    $('partnerGroup').style.display =
      name.indexOf(TWO_PERSON_KEYWORD) !== -1 ? 'block' : 'none';

    if (reload) {

      // 不同課程的時長可能不同，可預約日期與時段要重新查
      selectedTime = '';
      monthAvailabilityKey = '';

      renderCalendar();

      if (selectedDate) loadTimes();

    }

  }

  /* ==================================================
     月曆
  ================================================== */

  function pad2(n) {
    return String(n).padStart(2, '0');
  }

  function toDateStr(year, month, day) {
    return year + '-' + pad2(month + 1) + '-' + pad2(day);
  }

  function toYearMonthStr(year, month) {
    return year + '-' + pad2(month + 1);
  }

  async function ensureMonthAvailability(year, month) {

    const key = toYearMonthStr(year, month);

    if (key === monthAvailabilityKey) return;

    try {

      const result = await callGAS(
        'getAvailableDatesInMonth',
        { yearMonth: key, service: $('service').value }
      );

      if (result && result.success) {
        monthAvailability = result.dates || {};
        monthAvailabilityFailed = false;
      } else {
        monthAvailability = {};
        monthAvailabilityFailed = true;
      }

    } catch (error) {

      console.error('ensureMonthAvailability ERROR:', error);

      monthAvailability = {};
      monthAvailabilityFailed = true;

    }

    monthAvailabilityKey = key;

  }

  async function renderCalendar() {

    const container = $('calendar');

    const year = calendarViewDate.getFullYear();
    const month = calendarViewDate.getMonth();

    if (toYearMonthStr(year, month) !== monthAvailabilityKey) {

      container.innerHTML =
        '<div class="no-time">' +
          '<span class="loading">' +
            '<span class="loading-dot"></span>' +
            '<span class="loading-dot"></span>' +
            '<span class="loading-dot"></span>' +
            '讀取可預約日期' +
          '</span>' +
        '</div>';

    }

    await ensureMonthAvailability(year, month);

    renderCalendarGrid();

  }

  function renderCalendarGrid() {

    const container = $('calendar');

    const year = calendarViewDate.getFullYear();
    const month = calendarViewDate.getMonth();

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const startWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const isPastMonth =
      year < today.getFullYear() ||
      (year === today.getFullYear() && month < today.getMonth());

    let html = '';

    html +=
      '<div class="calendar-header">' +
        '<button type="button" class="calendar-nav" id="prevMonth"' +
          (isPastMonth ? ' disabled' : '') +
        '>&#8249;</button>' +
        '<div class="calendar-title">' +
          year + '年' + (month + 1) + '月' +
        '</div>' +
        '<button type="button" class="calendar-nav" id="nextMonth">&#8250;</button>' +
      '</div>';

    html += '<div class="calendar-weekdays">';

    ['日', '一', '二', '三', '四', '五', '六'].forEach(function (w) {
      html += '<div>' + w + '</div>';
    });

    html += '</div><div class="calendar-days">';

    for (let i = 0; i < startWeekday; i++) {
      html += '<div class="calendar-day empty"></div>';
    }

    for (let d = 1; d <= daysInMonth; d++) {

      const dateObj = new Date(year, month, d);
      dateObj.setHours(0, 0, 0, 0);

      const dateStr = toDateStr(year, month, d);

      const isPast = dateObj < today;
      const isToday = dateObj.getTime() === today.getTime();
      const isSelected = dateStr === selectedDate;

      const hasAvailability =
        Object.prototype.hasOwnProperty.call(monthAvailability, dateStr)
          ? monthAvailability[dateStr]
          : false;

      const isDisabled =
        isPast || monthAvailabilityFailed || !hasAvailability;

      let cls = 'calendar-day';

      if (isDisabled) cls += ' disabled';
      if (isToday) cls += ' today';
      if (isSelected) cls += ' selected';

      html +=
        '<button type="button" class="' + cls + '" data-date="' + dateStr + '"' +
        (isDisabled ? ' disabled' : '') + '>' + d + '</button>';

    }

    html += '</div>';

    container.innerHTML = html;

    $('prevMonth').addEventListener('click', function () {
      calendarViewDate.setDate(1);
      calendarViewDate.setMonth(calendarViewDate.getMonth() - 1);
      renderCalendar();
    });

    $('nextMonth').addEventListener('click', function () {
      calendarViewDate.setDate(1);
      calendarViewDate.setMonth(calendarViewDate.getMonth() + 1);
      renderCalendar();
    });

    container
      .querySelectorAll('.calendar-day:not(.empty):not(.disabled)')
      .forEach(function (btn) {

        btn.addEventListener('click', function () {

          selectedDate = btn.dataset.date;

          renderCalendarGrid();
          updateSelectedDateLabel();
          loadTimes();

        });

      });

  }

  function updateSelectedDateLabel() {

    $('selectedDateLabel').innerHTML = selectedDate
      ? '已選擇日期：<strong>' + selectedDate + '</strong>'
      : '請點選日期';

  }

  /* ==================================================
     LIFF
  ================================================== */

  async function initLIFF() {

    const status = $('lineStatus');

    try {

      status.innerText = 'LINE 初始化中...';

      await liff.init({ liffId: CONFIG.LIFF_ID });

      if (!liff.isLoggedIn()) {

        status.innerText = 'LINE 登入中...';

        liff.login({ redirectUri: window.location.href });

        return;

      }

      const profile = await liff.getProfile();

      if (!profile || !profile.userId) {
        throw new Error('無法取得 LINE User ID');
      }

      lineUserId = profile.userId;
      lineIdToken = liff.getIDToken();

      if (!lineIdToken) {
        console.warn('拿不到 idToken，請確認 LIFF App 的 Scope 是否有勾選 openid');
      }

      liffReady = true;
      refreshTrialEligibility();

      status.innerText = '✓ LINE 已連線';
      status.classList.add('success-status');

    } catch (error) {

      console.error('LIFF ERROR:', error);

      status.innerText = 'LINE 初始化失敗';
      status.classList.add('error-status');

      $('message').innerHTML =
        '<div class="success">' +
          '<div class="success-title">LINE 連線異常</div>' +
          '<div class="success-notice">' +
            escapeHtml(error.message || String(error)) +
          '</div>' +
        '</div>';

    }

  }

  /* ==================================================
     呼叫 GAS API
  ================================================== */

  async function callGAS(action, data) {

    const response = await fetch(CONFIG.GAS_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, data: data || {} })
    });

    if (!response.ok) {
      throw new Error('GAS API HTTP ' + response.status);
    }

    const text = await response.text();

    try {

      return JSON.parse(text);

    } catch (error) {

      console.error('GAS 回傳內容:', text);

      throw new Error('GAS 回傳不是有效 JSON');

    }

  }

  /* ==================================================
     取得可預約時間
  ================================================== */

  async function loadTimes() {

    selectedTime = '';

    const date = selectedDate;
    const container = $('times');

    if (!date) {
      container.innerHTML = '<div class="no-time">請先選擇日期</div>';
      return;
    }

    container.innerHTML =
      '<div class="no-time">' +
        '<span class="loading">' +
          '<span class="loading-dot"></span>' +
          '<span class="loading-dot"></span>' +
          '<span class="loading-dot"></span>' +
          '讀取可預約時段' +
        '</span>' +
      '</div>';

    try {

      const result = await callGAS(
        'getAvailableTimes',
        { date: date, service: $('service').value }
      );

      // 讀取期間使用者又改選了別天，這次的結果就不用了
      if (date !== selectedDate) return;

      if (!result || !result.success) {
        throw new Error(result && result.message ? result.message : '讀取時段失敗');
      }

      const times = result.times || [];

      container.innerHTML = '';

      if (times.length === 0) {
        container.innerHTML = '<div class="no-time">這天沒有可預約時段</div>';
        return;
      }

      times.forEach(function (entry) {

        const time = typeof entry === 'string' ? entry : entry.time;

        const backendAvailable =
          typeof entry === 'string' ? true : (entry.available !== false);

        const isDisabled = !backendAvailable || isTimeInPast(date, time);

        const button = document.createElement('button');

        button.type = 'button';
        button.className = 'time-button' + (isDisabled ? ' disabled' : '');
        button.innerText = formatTime(time);

        if (isDisabled) {

          button.disabled = true;

        } else {

          button.addEventListener('click', function () {

            selectedTime = time;

            document.querySelectorAll('.time-button').forEach(function (btn) {
              btn.classList.remove('selected');
            });

            button.classList.add('selected');

          });

        }

        container.appendChild(button);

      });

    } catch (error) {

      console.error('loadTimes ERROR:', error);

      container.innerHTML =
        '<div class="no-time">讀取失敗：' + escapeHtml(error.message) + '</div>';

    }

  }

  function formatTime(value) {

    if (!value) return '';

    const text = String(value).trim();
    const match = text.match(/(\d{1,2}):(\d{2})/);

    return match
      ? String(Number(match[1])).padStart(2, '0') + ':' + match[2]
      : text;

  }

  function isTimeInPast(dateStr, timeStr) {

    if (!dateStr || !timeStr) return false;

    const now = new Date();

    const todayStr = toDateStr(now.getFullYear(), now.getMonth(), now.getDate());

    if (dateStr !== todayStr) return false;

    const match = String(timeStr).match(/(\d{1,2}):(\d{2})/);

    if (!match) return false;

    const slotDate = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate(),
      Number(match[1]),
      Number(match[2])
    );

    return slotDate <= now;

  }

  /* ==================================================
     確認預約
     - 是否為新生、有沒有課程包，一律由後端判斷
     - 體驗課限新生、每人一次；正式課程有剩餘堂數會自動扣堂
  ================================================== */

  async function submitReservation() {

    if (serviceDisabled) {
      alert('目前線上預約暫停使用，請透過 LINE 官方帳號或電話與我們聯繫。');
      return;
    }

    const service = $('service').value;
    const name = $('name').value.trim();
    const phone = $('phone').value.trim();
    const partnerName = $('partnerName').value.trim();

    if (!liffReady || !lineUserId) {
      alert('LINE 尚未連線，請從 LINE 官方帳號開啟預約。');
      return;
    }

    if (!service) { alert('請選擇課程'); return; }
    if (!selectedDate) { alert('請選擇日期'); return; }
    if (!selectedTime) { alert('請選擇時間'); return; }
    if (!name) { alert('請輸入姓名'); return; }
    if (!phone) { alert('請輸入電話'); return; }

    if (service.indexOf(TWO_PERSON_KEYWORD) !== -1 && !partnerName) {
      alert('一對二體驗請填寫同行夥伴的姓名');
      return;
    }

    const button = $('submitButton');

    button.disabled = true;
    button.innerText = '預約中...';

    $('message').innerHTML = '';

    try {

      await doCreateReservation({
        date: selectedDate,
        time: selectedTime,
        service: service,
        name: name,
        phone: phone,
        partnerName: service.indexOf(TWO_PERSON_KEYWORD) !== -1 ? partnerName : '',

        // 後端使用 idToken 向 LINE 官方驗證身分
        idToken: lineIdToken
      });

    } finally {

      button.disabled = false;
      button.innerText = '確認預約';

    }

  }

  async function doCreateReservation(payload) {

    try {

      const result = await callGAS('createReservation', payload);

      if (result && result.success) {

        let sentToLine = false;

        // 只有 LINE 內的聊天室情境才嘗試傳送訊息
        if (result.notificationMessage && liff.isInClient()) {

          try {

            await liff.sendMessages([result.notificationMessage]);
            sentToLine = true;

          } catch (sendError) {

            console.warn('sendMessages 失敗（不影響預約結果）:', sendError);

          }

        }

        renderSuccessMessage(result, sentToLine);
        resetForm();

      } else {

        alert(
          result && result.message
            ? result.message
            : '預約失敗，請稍後再試。'
        );

        loadTimes();

      }

    } catch (error) {

      console.error('createReservation ERROR:', error);

      alert('系統發生錯誤：' + error.message);

    }

  }

  /* ==================================================
     顯示預約成功訊息
  ================================================== */

  function renderSuccessMessage(result, sentToLine) {

    const isPackage = result.paymentType === '課程包扣堂';

    const fee = isPackage
      ? '課程包扣 1 堂（剩餘 ' + (result.remainingSessions || 0) + ' 堂）'
      : formatMoney(result.price || 0);

    $('message').innerHTML =
      '<div class="success">' +

        '<div class="success-title">🎉 預約成功！</div>' +

        '<div class="reservation-id">' +
          escapeHtml(result.reservationId || '') +
        '</div>' +

        '<div class="success-info">' +
          successRow('日期', result.date || '') +
          successRow('時間', formatTime(result.time)) +
          successRow('課程', shortName(result.service || '')) +
          (result.partnerName ? successRow('同行夥伴', result.partnerName) : '') +
          successRow('費用', fee) +
        '</div>' +

        '<div class="success-notice">' +
          (sentToLine
            ? '預約確認通知已傳送至您的 LINE。'
            : '預約已完成，期待與您見面。') +
        '</div>' +

      '</div>';

    $('message').scrollIntoView({ behavior: 'smooth', block: 'center' });

  }

  function successRow(label, value) {

    return (
      '<div class="success-row">' +
        '<div class="success-label">' + escapeHtml(label) + '</div>' +
        '<div class="success-value">' + escapeHtml(value) + '</div>' +
      '</div>'
    );

  }

  /* ==================================================
     服務暫停畫面
  ================================================== */

  function showServiceDisabledOverlay() {

    document.querySelector('.booking-card').innerHTML =
      '<div class="success">' +
        '<div class="success-title">🛠 服務暫停中</div>' +
        '<div class="success-notice">' +
          '目前線上預約暫停使用，請直接透過 LINE 官方帳號或電話與我們聯繫，造成不便敬請見諒。' +
        '</div>' +
      '</div>';

  }

  /* ==================================================
     重置表單
  ================================================== */

  function resetForm() {

    selectedTime = '';
    selectedDate = '';
    calendarViewDate = new Date();

    // 完成預約後，強制重新查詢當月可預約日期
    monthAvailabilityKey = '';

    renderCalendar();
    updateSelectedDateLabel();

    $('times').innerHTML = '<div class="no-time">請先選擇日期</div>';

    $('name').value = '';
    $('phone').value = '';
    $('partnerName').value = '';

  }

  /* ==================================================
     HTML Escape
  ================================================== */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }

</script>
