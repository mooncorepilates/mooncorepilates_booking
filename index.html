<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6F4E37">

  <title>MOON CORE PILATES｜線上預約</title>

  <style>

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #F6EFE4;
      color: #4A3B30;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      width: 100%;
      background:
        linear-gradient(
          135deg,
          #6F4E37 0%,
          #5C4033 100%
        );
      color: #FFFFFF;
      padding:
        max(28px, env(safe-area-inset-top))
        24px
        32px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -70px;
      top: -90px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }

    .header::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      left: -70px;
      bottom: -80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
    }

    .header-inner {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
    }

    .header-small {
      color: #EBDCC3;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .header-title {
      margin-top: 7px;
      font-size: clamp(25px, 5vw, 32px);
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .header-sub {
      margin-top: 7px;
      color: #E2D3BC;
      font-size: 12px;
      letter-spacing: 1.5px;
    }

    /* =========================
       CONTAINER
    ========================= */

    .container {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      padding:
        24px 18px
        calc(40px + env(safe-area-inset-bottom));
    }

    /* =========================
       CARD
    ========================= */

    .booking-card {
      background: #FFFFFF;
      border: 1px solid rgba(220, 201, 174, 0.75);
      border-radius: 18px;
      padding: 22px 18px 24px;
      box-shadow: 0 8px 30px rgba(75, 52, 42, 0.08);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #4B342A;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .section-title::before {
      content: "";
      width: 5px;
      height: 23px;
      border-radius: 10px;
      background: #8B5E3C;
    }

    .section-description {
      margin: 0 0 22px 15px;
      color: #85735F;
      font-size: 13px;
      line-height: 1.6;
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
      margin-top: 20px;
    }

    .form-group:first-of-type {
      margin-top: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #8A7260;
      font-size: 14px;
      font-weight: 600;
    }

    select,
    input {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #DCC9AE;
      border-radius: 10px;
      background: #FFFFFF;
      font-family: inherit;
      font-size: 16px;
      color: #4A3B30;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #6F4E37;
      background: #FFFCF7;
      box-shadow: 0 0 0 3px rgba(111, 78, 55, 0.15);
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 110px;
      padding: 12px 14px;
      border: 1px solid #DCC9AE;
      border-radius: 10px;
      background: #FFFFFF;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.6;
      color: #4A3B30;
      outline: none;
      resize: vertical;
    }

    textarea:focus {
      border-color: #6F4E37;
      background: #FFFCF7;
      box-shadow: 0 0 0 3px rgba(111, 78, 55, 0.15);
    }

    textarea::placeholder {
      color: #B8A99A;
    }

    input::placeholder {
      color: #B8A99A;
    }

    /* =========================
       SELECT
    ========================= */

    select {
      appearance: none;
      -webkit-appearance: none;

      background-image:
        linear-gradient(
          45deg,
          transparent 50%,
          #6F4E37 50%
        ),
        linear-gradient(
          135deg,
          #6F4E37 50%,
          transparent 50%
        );

      background-position:
        calc(100% - 18px) 21px,
        calc(100% - 12px) 21px;

      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 40px;
    }

    /* =========================
       CALENDAR
    ========================= */

    .calendar {
      border: 1px solid #DCC9AE;
      border-radius: 14px;
      padding: 14px;
      background: #FFFFFF;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .calendar-nav {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: #F1E8DA;
      color: #4B342A;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calendar-nav:disabled {
      opacity: .3;
      cursor: not-allowed;
    }

    .calendar-title {
      font-size: 16px;
      font-weight: 800;
      color: #4B342A;
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      color: #85735F;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .calendar-day {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 14px;
      font-family: inherit;
      color: #4A3B30;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .calendar-day.empty {
      cursor: default;
    }

    .calendar-day.disabled {
      color: #D9CFC2;
      cursor: not-allowed;
    }

    .calendar-day.today {
      font-weight: 800;
      color: #6F4E37;
    }

    .calendar-day.selected {
      background: #6F4E37;
      color: #FFFFFF;
      font-weight: 800;
    }

    .calendar-day:not(.disabled):not(.empty):not(.selected):hover {
      background: #F1E8DA;
    }

    .selected-date-label {
      margin-top: 10px;
      font-size: 13px;
      color: #4B342A;
      text-align: center;
    }

    .selected-date-label strong {
      color: #8B5E3C;
    }

    /* =========================
       TIME
    ========================= */

    .time-wrapper {
      margin-top: 20px;
    }

    .times {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
    }

    .time-button {
      width: 100%;
      min-height: 48px;
      border: 1px solid #6F4E37;
      background: #FFFFFF;
      color: #4B342A;
      border-radius: 10px;
      padding: 11px 5px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .time-button.selected {
      background: #6F4E37;
      border-color: #6F4E37;
      color: #FFFFFF;
      box-shadow: 0 4px 10px rgba(111, 78, 55, 0.25);
    }

    .time-button.disabled,
    .time-button:disabled {
      background: #F1ECE4;
      border-color: #E0D6C9;
      color: #B8A99A;
      cursor: not-allowed;
      box-shadow: none;
    }

    .no-time {
      grid-column: 1 / -1;
      padding: 15px 10px;
      border-radius: 10px;
      background: #F8F3EA;
      color: #85735F;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    /* =========================
       SUBMIT
    ========================= */

    .submit {
      display: block;
      width: 100%;
      min-height: 52px;
      margin-top: 28px;
      padding: 14px 18px;
      border: none;
      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #8B5E3C 0%,
          #7A5033 100%
        );

      color: #FFFFFF;
      font-family: inherit;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(139, 94, 60, 0.22);
    }

    .submit:hover {
      background:
        linear-gradient(
          135deg,
          #7A5033 0%,
          #6A4429 100%
        );
    }

    .submit:disabled {
      opacity: .55;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* =========================
       SERVICE NOTE
    ========================= */

    .service-note {
      margin-top: 10px;
      padding: 11px 13px;
      border-radius: 10px;
      background: #F1E8DA;
      border: 1px solid #EADFCB;
      color: #6B5646;
      font-size: 12.5px;
      line-height: 1.75;
    }

    .service-note:empty {
      display: none;
    }

/* =========================
       MESSAGE
    ========================= */

    .message {
      margin-top: 18px;
      color: #4B342A;
      line-height: 1.8;
      font-size: 14px;
    }

    .success {
      padding: 20px 18px;
      margin-top: 0;
      border-radius: 13px;
      background: #FFFCF6;
      border: 1px solid #DCC9AE;
      box-shadow: 0 4px 14px rgba(74, 59, 48, 0.05);
    }

    .success-title {
      color: #4B342A;
      font-size: 20px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 12px;
    }

    .reservation-id {
      display: block;
      width: 100%;
      color: #8B5E3C;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      margin: 5px 0 18px;
    }

    .success-info {
      padding: 14px;
      border-radius: 10px;
      background: #FFFFFF;
      border: 1px solid #EADFCB;
    }

    .success-row {
      padding: 8px 0;
      border-bottom: 1px solid #EFE6D8;
      font-size: 14px;
      line-height: 1.6;
    }

    .success-row:last-child {
      border-bottom: none;
    }

    .success-label {
      color: #85735F;
      font-size: 12px;
      margin-bottom: 2px;
    }

    .success-value {
      color: #4A3B30;
      font-weight: 600;
    }

    .success-notice {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #F1E8DA;
      color: #4B342A;
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
    }

    /* =========================
       LINE STATUS
    ========================= */

    .line-status {
      margin-top: 13px;
      padding: 0 5px;
      font-size: 12px;
      color: #8A7260;
      text-align: center;
      line-height: 1.6;
    }

    .success-status {
      color: #4B342A;
    }

    .error-status {
      color: #B4533C;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .loading-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6F4E37;
      animation: loading 1s infinite ease-in-out;
    }

    .loading-dot:nth-child(2) {
      animation-delay: .15s;
    }

    .loading-dot:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes loading {
      0%,
      60%,
      100% {
        opacity: .3;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    @media (min-width: 600px) {

      .header {
        padding: 36px 32px;
      }

      .container {
        padding: 34px 24px 50px;
      }

      .booking-card {
        padding: 30px;
      }

      .times {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

    }

    @media (min-width: 900px) {

      .header {
        padding: 38px 30px;
      }

      .container {
        padding: 45px 30px 70px;
      }

      .booking-card {
        padding: 34px;
        border-radius: 20px;
      }

      .section-title {
        font-size: 22px;
      }

      .times {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 11px;
      }

      .submit {
        min-height: 56px;
        font-size: 18px;
      }

    }

    @media (max-width: 359px) {

      .header {
        padding-left: 18px;
        padding-right: 18px;
      }

      .container {
        padding: 18px 12px 35px;
      }

      .booking-card {
        padding: 18px 14px 20px;
        border-radius: 15px;
      }

      .section-title {
        font-size: 18px;
      }

      .times {
        gap: 7px;
      }

      .time-button {
        min-height: 45px;
        font-size: 14px;
      }

    }

  
    .coach-button {
      width: 100%;
      min-height: 48px;
      border: 1px solid #6F4E37;
      background: #FFFFFF;
      color: #4B342A;
      border-radius: 10px;
      padding: 11px 5px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .coach-button.selected {
      background: #6F4E37;
      border-color: #6F4E37;
      color: #FFFFFF;
      box-shadow: 0 4px 10px rgba(111, 78, 55, 0.25);
    }

    .coach-button.disabled,
    .coach-button:disabled {
      background: #F1ECE4;
      border-color: #E0D6C9;
      color: #B8A99A;
      cursor: not-allowed;
      box-shadow: none;
    }

  
    [hidden] {
      display: none !important;
    }

  </style>

</head>

<body>

<header class="header">

  <div class="header-inner">

    <div class="header-small">
      MOON CORE PILATES
    </div>

    <div class="header-title">
      線上預約
    </div>

    <div class="header-sub">
      ONLINE RESERVATION
    </div>

  </div>

</header>

<main class="container">

  <section class="booking-card" id="bookView">

    <div class="section-title">
      預約課程
    </div>

    <div class="section-description">
      請選擇課程、日期與方便的時間，我們會為您保留預約。每堂 60 分鐘，採預約制。
    </div>

    <div class="form-group">

      <label for="service">
        選擇課程
      </label>

      <select id="service">
        <option value="">讀取課程中...</option>
      </select>

      <div id="serviceNote" class="service-note"></div>
      <div id="pkgInfo" class="service-note" hidden></div>

    </div>

    <div class="form-group">

      <label>
        選擇日期
      </label>

      <div id="calendar" class="calendar">
        <div class="no-time">讀取可預約日期...</div>
      </div>

      <div id="selectedDateLabel" class="selected-date-label">
        請點選日期
      </div>

    </div>

    <div class="time-wrapper">

      <label>
        選擇時間
      </label>

      <div id="times" class="times">
        <div class="no-time">
          請先選擇日期
        </div>
      </div>

    </div>

    <div class="form-group" id="coachGroup" style="display:none;">

      <label id="coachLabel">
        選擇教練
      </label>

      <div id="coachChoices" class="times"></div>

    </div>

    <div class="form-group">

      <label for="name">
        姓名
      </label>

      <input type="text" id="name" placeholder="請輸入姓名" autocomplete="name">

    </div>

    <div class="form-group">

      <label for="phone">
        電話
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="請輸入聯絡電話"
        autocomplete="tel"
        inputmode="tel"
      >

      <div id="idHint" class="service-note" hidden>
        已帶入您的會員資料；如需修改姓名或電話，請與工作室聯繫。
      </div>

    </div>

    <!-- 只有「一對二」體驗才會顯示 -->
    <div class="form-group" id="partnerGroup" style="display:none;">

      <label for="partnerName">
        同行夥伴姓名
      </label>

      <input type="text" id="partnerName" placeholder="請輸入同行夥伴的姓名" maxlength="30">

      <div id="partnerPhoneWrap" style="display:none; margin-top:10px;">

        <label for="partnerPhone">
          同行夥伴電話
        </label>

        <input
          type="tel"
          id="partnerPhone"
          placeholder="請輸入夥伴的電話（要與他的會員資料一致）"
          inputmode="tel"
          maxlength="20"
        >

      </div>

    </div>

    <div class="form-group" id="noteGroup">

      <label for="studentNote">
        想請教練特別注意或幫您改善的地方？（選填）
      </label>

      <textarea
        id="studentNote"
        rows="4"
        maxlength="300"
        placeholder="例：最近常腰痠、想改善駝背、生理期中、膝蓋曾受過傷…等，都可以寫在這裡喔！"
      ></textarea>

    </div>

    <button id="submitButton" class="submit" type="button">
      確認預約
    </button>

    <div id="message" class="message"></div>

    <div id="lineStatus" class="line-status">
      LINE 初始化中...
    </div>

  </section>

</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script src="config.js"></script>

<script>

  /* ==================================================
     設定值放在 config.js（CONFIG.LIFF_ID / CONFIG.GAS_ENDPOINT），
     換 LIFF App 或重新部署 GAS 時只需要改 config.js。
  ================================================== */

  // 服務名稱以「體驗課」開頭的是首次體驗課（需與後端 CustomLogic.gs 一致）
  const TRIAL_PREFIX = '體驗課';
  const TWO_PERSON_KEYWORD = '一對二';

  const NOTE_TRIAL =
    '體驗課僅限首次預約（新生限定），每人限體驗一次，每堂 60 分鐘，教練由工作室為您安排。後續預約請選擇正式課程。';

  const NOTE_FORMAL =
    '正式課程不區分器械種類，由老師依個人需求安排核心床、凱迪拉克及其他器械，使用凱迪拉克不另加價。' +
    '本工作室沒有儲值金，僅提供包堂方案。';

  const NOTE_PACKAGE =
    '您有課程：預約時會先為您保留 1 堂，上完課才會正式扣除；只會顯示專屬教練有空的時段，同一時段有兩位教練都有空時，可以自己選擇。';

  const NOTE_JOINT =
    '一對二課程需要兩位同行夥伴「共同預約」：兩位都要有一對二課程，預約時各保留 1 堂，教練由工作室安排。' +
    '如果其中一位臨時請假，請與工作室聯繫：可以兩人一起改期，或改成一對一並補差額。';

  const NOTE_SINGLE =
    '目前沒有可用的課程，將以單堂價格預約，教練由工作室為您安排。想購買課程請與工作室聯繫。';

  let selectedTime = '';
  let selectedDate = '';
  let calendarViewDate = new Date();

  let monthAvailability = {};
  let monthAvailabilityKey = '';
  let monthAvailabilityFailed = false;

  // 整個月的資料（日期＋每天時段）依「課程＋身分＋月份」快取；點日期、切月份都不用再等伺服器
  let monthSlots = {};
  const monthCache = {};
  const monthInflight = {};
  const CACHE_FRESH_MS = 30000;

  // lineUserId 僅用於畫面判斷，不會傳給後端當作身分依據
  let lineUserId = '';

  // idToken 才是後端會拿去跟 LINE 官方驗證身分的依據
  let lineIdToken = '';

  let liffReady = false;
  let serviceDisabled = false;

  // 以 LINE 帳號判斷的身分狀態（由後端 getMyStatus 回傳）
  let ME = { bound: false, hasPackage: false, hasTwo: false, credits: 0, coaches: [], trialEligible: true };
  let meReady = false;
  let liffSettled = false;
  let servicesLoaded = false;
  let lastIdKey = '';

  // 這個時段有空的專屬教練（課程會員才會有），以及客人選的教練
  let slotCoaches = [];
  let selectedCoach = '';

  const $ = function (id) { return document.getElementById(id); };

  /* ==================================================
     初始化
  ================================================== */

  window.addEventListener('load', function () {

    initLIFF();
    checkServiceStatus();
    loadServices();

    // LINE 查詢太久沒回應時，不要一直卡在讀取畫面
    setTimeout(function () {
      if (!meReady || !liffSettled) {
        meReady = true;
        liffSettled = true;
        maybeRenderCalendar();
      }
    }, 8000);

  });

  $('submitButton').addEventListener('click', submitReservation);

  $('service').addEventListener('change', function () { onServiceChange(true); });

  async function checkServiceStatus() {

    try {

      const result = await callGAS('checkStatus', {});

      if (result && result.success && result.active === false) {
        serviceDisabled = true;
        showServiceDisabledOverlay();
      }

    } catch (error) {

      // 查詢失敗不顯示暫停畫面，避免網路問題影響正常客戶
      console.error('checkServiceStatus ERROR:', error);

    }

  }

  /* ==================================================
     課程清單（從「服務項目」工作表讀取）
  ================================================== */

  function isTrial(name) {
    return String(name).indexOf(TRIAL_PREFIX) === 0;
  }

  // 正式的一對二（課程）：兩位學生共同預約
  function isJointService(name) {
    return !isTrial(name) && String(name).indexOf(TWO_PERSON_KEYWORD) !== -1;
  }

  function shortName(name) {
    return String(name).replace(/^(體驗課|正式課程)[｜|]\s*/, '');
  }

  function formatMoney(n) {
    return '$' + Number(n).toLocaleString('en-US');
  }

  function addServiceGroup(select, label, names, services) {

    if (!names.length) return;

    const group = document.createElement('optgroup');
    group.label = label;

    if (label.indexOf('首次') === 0) group.dataset.trial = '1';

    names.forEach(function (name) {

      const option = document.createElement('option');

      option.value = name;
      option.dataset.price = services[name].price;
      option.textContent = shortName(name) + '｜' + formatMoney(services[name].price);

      group.appendChild(option);

    });

    select.appendChild(group);

  }

  async function loadServices() {

    const select = $('service');

    try {

      const result = await callGAS('getServices', {});

      if (!result || !result.success) {
        throw new Error('讀取課程失敗，請重新整理頁面');
      }

      const services = result.services || {};
      const names = Object.keys(services);

      if (!names.length) {
        throw new Error('目前沒有開放預約的課程');
      }

      select.innerHTML = '';

      addServiceGroup(
        select,
        '首次體驗課（新生限定）',
        names.filter(isTrial),
        services
      );

      addServiceGroup(
        select,
        '正式課程',
        names.filter(function (n) { return !isTrial(n); }),
        services
      );

    } catch (error) {

      console.error('loadServices ERROR:', error);

      select.innerHTML =
        '<option value="">' + escapeHtml(error.message) + '</option>';

    }

    servicesLoaded = true;

    onServiceChange(false);
    applyTrialState();
    updateServiceLabels();
    maybeRenderCalendar();

  }

  /* ==================================================
     身分狀態：以 LINE 帳號判斷是不是新生、有沒有課程、專屬教練是誰
  ================================================== */

  function identity() {
    return {
      idToken: lineIdToken,
      phone: $('phone').value.trim(),
      name: $('name').value.trim()
    };
  }

  // 課程清單載入好、LINE 登入完成（或確定無法登入）就開始載入日期，不必等身分狀態查詢
  function maybeRenderCalendar() {
    if (servicesLoaded && (liffSettled || meReady)) renderCalendar();
  }

  function noteFor(name) {

    if (!name) return '';
    if (isTrial(name)) return NOTE_TRIAL;
    if (isJointService(name)) return NOTE_FORMAL + NOTE_JOINT;

    return NOTE_FORMAL + (ME.hasPackage ? NOTE_PACKAGE : NOTE_SINGLE);

  }

  /* 體驗課只有首次預約：不是首次的人，體驗課選項直接停用 */
  function applyTrialState() {

    const select = $('service');
    const group = select.querySelector('optgroup[data-trial]');

    if (!group) return;

    const allowed = ME.trialEligible !== false;

    group.label = allowed
      ? '首次體驗課（新生限定）'
      : '首次體驗課（僅限首次預約，您已不適用）';

    Array.prototype.forEach.call(group.children, function (option) {
      option.disabled = !allowed;
    });

    if (!allowed && isTrial(select.value)) {

      const next = Array.prototype.find.call(select.options, function (o) {
        return o.value && !o.disabled;
      });

      if (next) select.value = next.value;

      onServiceChange(true);

    }

  }

  // 有課程 → 顯示「使用課程」（上完課才扣）；沒有 → 顯示單堂價格
  function updateServiceLabels() {

    const options = $('service').querySelectorAll('optgroup:not([data-trial]) option');

    Array.prototype.forEach.call(options, function (o) {

      const base = shortName(o.value);

      if (isJointService(o.value)) {

        // 一對二：必須使用一對二課程（兩位都要有），不提供單堂線上預約
        o.textContent = ME.hasTwo
          ? base + '｜使用課程（各保留 1 堂，需兩位都有一對二課程）'
          : base + '｜需要一對二課程';
        o.disabled = !ME.hasTwo;

        return;

      }

      o.textContent = ME.hasPackage
        ? base + '｜使用課程（剩 ' + ME.credits + ' 堂，上完課才扣）'
        : base + '｜單堂 ' + formatMoney(o.dataset.price);

    });

    // 目前選到的選項被停用了，就改選第一個可用的
    const select = $('service');
    const cur = Array.prototype.find.call(select.options, function (o) { return o.value === select.value; });

    if (cur && cur.disabled) {

      const next = Array.prototype.find.call(select.options, function (o) { return o.value && !o.disabled; });

      if (next) {
        select.value = next.value;
        onServiceChange(true);
      }

    }

  }

  function updatePackageInfo() {

    const box = $('pkgInfo');

    if (!ME.hasPackage) {
      box.hidden = true;
      box.textContent = '';
      return;
    }

    box.hidden = false;
    box.textContent = ME.coaches.length
      ? '您有課程，剩餘 ' + ME.credits + ' 堂。專屬教練：' +
        ME.coaches.map(function (c) { return c.name; }).join('、') + '。'
      : '您有課程（剩餘 ' + ME.credits + ' 堂），但還沒有指定專屬教練，暫時無法線上預約，請與工作室聯繫。';

  }

  function lockIdentity(name, phone) {

    if (name) {
      $('name').value = name;
      $('name').readOnly = true;
    }

    if (phone) {
      $('phone').value = phone;
      $('phone').readOnly = true;
    }

    $('idHint').hidden = !(name || phone);

  }

  function hideCoachChoices() {

    slotCoaches = [];
    selectedCoach = '';

    $('coachGroup').style.display = 'none';
    $('coachChoices').innerHTML = '';

  }

  async function refreshMyStatus() {

    if (!lineIdToken) {

      if (!meReady) {
        meReady = true;
        maybeRenderCalendar();
      }

      return;

    }

    const id = identity();
    const key = id.phone + '|' + id.name;

    if (meReady && key === lastIdKey) return;

    lastIdKey = key;

    try {

      const r = await callGAS('getMyStatus', id);

      if (r && r.success) {

        const before = JSON.stringify([
          ME.hasPackage, ME.hasTwo, ME.credits, ME.coaches.map(function (c) { return c.account; }), ME.trialEligible
        ]);

        ME = {
          bound: !!r.bound,
          hasPackage: !!r.hasPackage,
          hasTwo: !!r.hasTwo,
          credits: r.credits || 0,
          coaches: r.coaches || [],
          trialEligible: r.trialEligible !== false
        };

        if (r.bound) lockIdentity(r.name, r.phone);

        applyTrialState();
        updateServiceLabels();
        updatePackageInfo();
        $('serviceNote').textContent = noteFor($('service').value);

        const after = JSON.stringify([
          ME.hasPackage, ME.hasTwo, ME.credits, ME.coaches.map(function (c) { return c.account; }), ME.trialEligible
        ]);

        // 身分狀態變了（例如輸入電話後認出課程），可預約日期與時段要重新查
        if (before !== after && servicesLoaded) {

          selectedTime = '';
          hideCoachChoices();
          monthAvailabilityKey = '';

          renderCalendar();

          if (selectedDate) loadTimes();

        }

      }

    } catch (error) {

      // 查詢失敗不影響預約，送出時後端仍會檢查
      console.error('refreshMyStatus ERROR:', error);

    }

    if (!meReady) {
      meReady = true;
      maybeRenderCalendar();
    }

  }

  $('phone').addEventListener('blur', refreshMyStatus);
  $('name').addEventListener('blur', refreshMyStatus);

  function onServiceChange(reload) {

    const name = $('service').value;

    $('serviceNote').textContent = noteFor(name);

    $('partnerGroup').style.display =
      name.indexOf(TWO_PERSON_KEYWORD) !== -1 ? 'block' : 'none';

    // 正式的一對二才需要夥伴電話（體驗課只填姓名）
    $('partnerPhoneWrap').style.display = isJointService(name) ? 'block' : 'none';

    if (reload) {

      // 不同課程的時長可能不同，可預約日期與時段要重新查
      selectedTime = '';
      hideCoachChoices();
      monthAvailabilityKey = '';

      maybeRenderCalendar();

      if (selectedDate) loadTimes();

    }

  }

  /* ==================================================
     月曆
  ================================================== */

  function pad2(n) {
    return String(n).padStart(2, '0');
  }

  function toDateStr(year, month, day) {
    return year + '-' + pad2(month + 1) + '-' + pad2(day);
  }

  function toYearMonthStr(year, month) {
    return year + '-' + pad2(month + 1);
  }

  function monthCacheKey(ym) {

    const id = identity();

    return [$('service').value, id.phone, id.name, ym].join('|');

  }

  // 向伺服器取得整個月（同一個月同時間只會發一次請求）
  function fetchMonth(ym) {

    const cacheKey = monthCacheKey(ym);

    if (monthInflight[cacheKey]) return monthInflight[cacheKey];

    monthInflight[cacheKey] = callGAS(
      'getAvailableDatesInMonth',
      Object.assign({ yearMonth: ym, service: $('service').value }, identity())
    ).then(function (result) {

      if (!result || !result.success) throw new Error('讀取可預約日期失敗');

      monthCache[cacheKey] = {
        dates: result.dates || {},
        slots: result.slots || {},
        noCoach: !!result.noCoach,
        at: Date.now()
      };

      return monthCache[cacheKey];

    }).finally(function () {

      delete monthInflight[cacheKey];

    });

    return monthInflight[cacheKey];

  }

  // 先在背景把下個月也載好，切到下個月就是立刻顯示
  function prefetchMonth(year, month) {

    const next = new Date(year, month + 1, 1);
    const ym = toYearMonthStr(next.getFullYear(), next.getMonth());

    if (monthCache[monthCacheKey(ym)] || monthInflight[monthCacheKey(ym)]) return;

    fetchMonth(ym).catch(function () { /* 預先載入失敗不影響使用 */ });

  }

  async function ensureMonthAvailability(year, month) {

    const key = toYearMonthStr(year, month);

    if (key === monthAvailabilityKey) return;

    try {

      const cached = monthCache[monthCacheKey(key)] || await fetchMonth(key);

      monthAvailability = cached.dates;
      monthSlots = cached.slots;
      monthAvailabilityFailed = false;

    } catch (error) {

      console.error('ensureMonthAvailability ERROR:', error);

      monthAvailability = {};
      monthSlots = {};
      monthAvailabilityFailed = true;

    }

    monthAvailabilityKey = key;

    prefetchMonth(year, month);

  }

  async function renderCalendar() {

    const container = $('calendar');

    const year = calendarViewDate.getFullYear();
    const month = calendarViewDate.getMonth();

    if (toYearMonthStr(year, month) !== monthAvailabilityKey) {

      container.innerHTML =
        '<div class="no-time">' +
          '<span class="loading">' +
            '<span class="loading-dot"></span>' +
            '<span class="loading-dot"></span>' +
            '<span class="loading-dot"></span>' +
            '讀取可預約日期' +
          '</span>' +
        '</div>';

    }

    await ensureMonthAvailability(year, month);

    renderCalendarGrid();

  }

  function renderCalendarGrid() {

    const container = $('calendar');

    const year = calendarViewDate.getFullYear();
    const month = calendarViewDate.getMonth();

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const startWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const isPastMonth =
      year < today.getFullYear() ||
      (year === today.getFullYear() && month < today.getMonth());

    let html = '';

    html +=
      '<div class="calendar-header">' +
        '<button type="button" class="calendar-nav" id="prevMonth"' +
          (isPastMonth ? ' disabled' : '') +
        '>&#8249;</button>' +
        '<div class="calendar-title">' +
          year + '年' + (month + 1) + '月' +
        '</div>' +
        '<button type="button" class="calendar-nav" id="nextMonth">&#8250;</button>' +
      '</div>';

    html += '<div class="calendar-weekdays">';

    ['日', '一', '二', '三', '四', '五', '六'].forEach(function (w) {
      html += '<div>' + w + '</div>';
    });

    html += '</div><div class="calendar-days">';

    for (let i = 0; i < startWeekday; i++) {
      html += '<div class="calendar-day empty"></div>';
    }

    for (let d = 1; d <= daysInMonth; d++) {

      const dateObj = new Date(year, month, d);
      dateObj.setHours(0, 0, 0, 0);

      const dateStr = toDateStr(year, month, d);

      const isPast = dateObj < today;
      const isToday = dateObj.getTime() === today.getTime();
      const isSelected = dateStr === selectedDate;

      const hasAvailability =
        Object.prototype.hasOwnProperty.call(monthAvailability, dateStr)
          ? monthAvailability[dateStr]
          : false;

      const isDisabled =
        isPast || monthAvailabilityFailed || !hasAvailability;

      let cls = 'calendar-day';

      if (isDisabled) cls += ' disabled';
      if (isToday) cls += ' today';
      if (isSelected) cls += ' selected';

      html +=
        '<button type="button" class="' + cls + '" data-date="' + dateStr + '"' +
        (isDisabled ? ' disabled' : '') + '>' + d + '</button>';

    }

    html += '</div>';

    container.innerHTML = html;

    $('prevMonth').addEventListener('click', function () {
      calendarViewDate.setDate(1);
      calendarViewDate.setMonth(calendarViewDate.getMonth() - 1);
      renderCalendar();
    });

    $('nextMonth').addEventListener('click', function () {
      calendarViewDate.setDate(1);
      calendarViewDate.setMonth(calendarViewDate.getMonth() + 1);
      renderCalendar();
    });

    container
      .querySelectorAll('.calendar-day:not(.empty):not(.disabled)')
      .forEach(function (btn) {

        btn.addEventListener('click', function () {

          selectedDate = btn.dataset.date;

          renderCalendarGrid();
          updateSelectedDateLabel();
          loadTimes();

        });

      });

  }

  function updateSelectedDateLabel() {

    $('selectedDateLabel').innerHTML = selectedDate
      ? '已選擇日期：<strong>' + selectedDate + '</strong>'
      : '請點選日期';

  }

  /* ==================================================
     LIFF
  ================================================== */

  async function initLIFF() {

    const status = $('lineStatus');

    try {

      status.innerText = 'LINE 初始化中...';

      await liff.init({ liffId: CONFIG.LIFF_ID });

      if (!liff.isLoggedIn()) {

        status.innerText = 'LINE 登入中...';

        liff.login({ redirectUri: window.location.href });

        return;

      }

      const profile = await liff.getProfile();

      if (!profile || !profile.userId) {
        throw new Error('無法取得 LINE User ID');
      }

      lineUserId = profile.userId;
      lineIdToken = liff.getIDToken();

      if (!lineIdToken) {
        console.warn('拿不到 idToken，請確認 LIFF App 的 Scope 是否有勾選 openid');
      }

      liffReady = true;
      liffSettled = true;
      maybeRenderCalendar();
      refreshMyStatus();

      status.innerText = '✓ LINE 已連線';
      status.classList.add('success-status');

    } catch (error) {

      console.error('LIFF ERROR:', error);

      status.innerText = 'LINE 初始化失敗';
      status.classList.add('error-status');

      liffSettled = true;

      if (!meReady) {
        meReady = true;
        maybeRenderCalendar();
      }

      $('message').innerHTML =
        '<div class="success">' +
          '<div class="success-title">LINE 連線異常</div>' +
          '<div class="success-notice">' +
            escapeHtml(error.message || String(error)) +
          '</div>' +
        '</div>';

    }

  }

  /* ==================================================
     呼叫 GAS API
  ================================================== */

  async function callGAS(action, data) {

    const response = await fetch(CONFIG.GAS_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, data: data || {} })
    });

    if (!response.ok) {
      throw new Error('GAS API HTTP ' + response.status);
    }

    const text = await response.text();

    try {

      return JSON.parse(text);

    } catch (error) {

      console.error('GAS 回傳內容:', text);

      throw new Error('GAS 回傳不是有效 JSON');

    }

  }

  /* ==================================================
     取得可預約時間
  ================================================== */

  // 選了時段後：課程會員依有空的教練數量，自動帶入或讓客人選
  function onTimePicked(entry) {

    selectedCoach = '';
    slotCoaches = (entry && entry.coaches) || [];

    const box = $('coachChoices');

    if (!slotCoaches.length) {
      hideCoachChoices();
      return;
    }

    $('coachGroup').style.display = 'block';

    if (slotCoaches.length === 1) {

      selectedCoach = slotCoaches[0].account;
      $('coachLabel').textContent = '上課教練';
      box.innerHTML =
        '<div class="no-time" style="grid-column:1/-1">' +
          escapeHtml(slotCoaches[0].name) + '（專屬教練）' +
        '</div>';

      return;

    }

    $('coachLabel').textContent = '選擇教練（這個時段有多位教練有空）';
    box.innerHTML = '';

    slotCoaches.forEach(function (c) {

      const b = document.createElement('button');

      b.type = 'button';
      b.className = 'coach-button';
      b.innerText = c.name;

      b.addEventListener('click', function () {

        selectedCoach = c.account;

        box.querySelectorAll('.coach-button').forEach(function (x) {
          x.classList.remove('selected');
        });

        b.classList.add('selected');

      });

      box.appendChild(b);

    });

  }

  // 把時段畫到畫面上（來源可以是快取，也可以是伺服器回傳）
  function renderTimes(date, times, noCoach) {

    const container = $('times');

    container.innerHTML = '';

    if (noCoach) {
      container.innerHTML =
        '<div class="no-time">您的課程還沒有指定專屬教練，請與工作室聯繫。</div>';
      return;
    }

    if (!times || times.length === 0) {
      container.innerHTML = '<div class="no-time">這天沒有可預約時段</div>';
      return;
    }

    times.forEach(function (entry) {

      const time = typeof entry === 'string' ? entry : entry.time;

      const backendAvailable =
        typeof entry === 'string' ? true : (entry.available !== false);

      const isDisabled = !backendAvailable || isTimeInPast(date, time);

      const button = document.createElement('button');

      button.type = 'button';
      button.className = 'time-button' + (isDisabled ? ' disabled' : '');
      button.innerText = formatTime(time);

      if (isDisabled) {

        button.disabled = true;

      } else {

        button.addEventListener('click', function () {

          selectedTime = time;

          document.querySelectorAll('.time-button').forEach(function (btn) {
            btn.classList.remove('selected');
          });

          button.classList.add('selected');

          onTimePicked(entry);

        });

      }

      container.appendChild(button);

    });

  }

  // 背景悄悄更新這個月；使用者還沒選時段時，才會把畫面換成最新的
  async function refreshMonthQuietly(date) {

    const ym = date.slice(0, 7);

    delete monthCache[monthCacheKey(ym)];

    try {

      const fresh = await fetchMonth(ym);

      if (monthAvailabilityKey === ym) {
        monthAvailability = fresh.dates;
        monthSlots = fresh.slots;
      }

      if (date === selectedDate && !selectedTime) {
        renderTimes(date, fresh.slots[date] || [], fresh.noCoach);
      }

    } catch (error) {

      // 背景更新失敗就維持原本的畫面

    }

  }

  async function loadTimes() {

    selectedTime = '';
    hideCoachChoices();

    const date = selectedDate;
    const container = $('times');

    if (!date) {
      container.innerHTML = '<div class="no-time">請先選擇日期</div>';
      return;
    }

    // 快取裡有這個月的資料：馬上顯示；資料超過 30 秒就在背景更新
    const cached = monthCache[monthCacheKey(date.slice(0, 7))];

    if (cached && cached.slots && cached.slots[date]) {

      renderTimes(date, cached.slots[date], cached.noCoach);

      if (Date.now() - cached.at > CACHE_FRESH_MS) refreshMonthQuietly(date);

      return;

    }

    container.innerHTML =
      '<div class="no-time">' +
        '<span class="loading">' +
          '<span class="loading-dot"></span>' +
          '<span class="loading-dot"></span>' +
          '<span class="loading-dot"></span>' +
          '讀取可預約時段' +
        '</span>' +
      '</div>';

    try {

      const result = await callGAS(
        'getAvailableTimes',
        Object.assign({ date: date, service: $('service').value }, identity())
      );

      // 讀取期間使用者又改選了別天，這次的結果就不用了
      if (date !== selectedDate) return;

      if (!result || !result.success) {
        throw new Error(result && result.message ? result.message : '讀取時段失敗');
      }

      renderTimes(date, result.times || [], result.noCoach);

    } catch (error) {

      console.error('loadTimes ERROR:', error);

      container.innerHTML =
        '<div class="no-time">讀取失敗：' + escapeHtml(error.message) + '</div>';

    }

  }

  function formatTime(value) {

    if (!value) return '';

    const text = String(value).trim();
    const match = text.match(/(\d{1,2}):(\d{2})/);

    return match
      ? String(Number(match[1])).padStart(2, '0') + ':' + match[2]
      : text;

  }

  function isTimeInPast(dateStr, timeStr) {

    if (!dateStr || !timeStr) return false;

    const now = new Date();

    const todayStr = toDateStr(now.getFullYear(), now.getMonth(), now.getDate());

    if (dateStr !== todayStr) return false;

    const match = String(timeStr).match(/(\d{1,2}):(\d{2})/);

    if (!match) return false;

    const slotDate = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate(),
      Number(match[1]),
      Number(match[2])
    );

    return slotDate <= now;

  }

  /* ==================================================
     確認預約
     - 是否為新生、有沒有課程，一律由後端判斷
     - 體驗課限新生、每人一次；正式課程有剩餘堂數會自動扣堂
  ================================================== */

  async function submitReservation() {

    if (serviceDisabled) {
      alert('目前線上預約暫停使用，請透過 LINE 官方帳號或電話與我們聯繫。');
      return;
    }

    const service = $('service').value;
    const name = $('name').value.trim();
    const phone = $('phone').value.trim();
    const partnerName = $('partnerName').value.trim();
    const partnerPhone = $('partnerPhone').value.trim();
    const studentNote = $('studentNote').value.trim();

    if (!liffReady || !lineUserId) {
      alert('LINE 尚未連線，請從 LINE 官方帳號開啟預約。');
      return;
    }

    if (!service) { alert('請選擇課程'); return; }
    if (!selectedDate) { alert('請選擇日期'); return; }
    if (!selectedTime) { alert('請選擇時間'); return; }
    if (!name) { alert('請輸入姓名'); return; }
    if (!phone) { alert('請輸入電話'); return; }

    if (service.indexOf(TWO_PERSON_KEYWORD) !== -1 && !partnerName) {
      alert(isJointService(service) ? '一對二課程請填寫同行夥伴的姓名與電話' : '一對二體驗請填寫同行夥伴的姓名');
      return;
    }

    if (isJointService(service) && !partnerPhone) {
      alert('一對二課程請填寫同行夥伴的電話（要與他的會員資料一致）');
      return;
    }

    if (slotCoaches.length > 1 && !selectedCoach) {
      alert('這個時段有多位教練有空，請先選擇要上課的教練');
      return;
    }

    const button = $('submitButton');

    button.disabled = true;
    button.innerText = '預約中...';

    $('message').innerHTML = '';

    try {

      await doCreateReservation({
        date: selectedDate,
        time: selectedTime,
        service: service,
        name: name,
        phone: phone,
        partnerName: service.indexOf(TWO_PERSON_KEYWORD) !== -1 ? partnerName : '',
        partnerPhone: isJointService(service) ? partnerPhone : '',
        studentNote: studentNote,
        coachAccount: selectedCoach,

        // 後端使用 idToken 向 LINE 官方驗證身分
        idToken: lineIdToken
      });

    } finally {

      button.disabled = false;
      button.innerText = '確認預約';

    }

  }

  async function doCreateReservation(payload) {

    try {

      const result = await callGAS('createReservation', payload);

      if (result && result.success) {

        let sentToLine = false;
        let noticeError = '';

        // 1) 先用 LIFF 從學生手機直接送出（免費，只有從 LINE 聊天室開啟才送得出去）
        if (result.notificationMessage && liff.isInClient()) {

          try {

            await liff.sendMessages([result.notificationMessage]);
            sentToLine = true;

          } catch (sendError) {

            noticeError = sendError && sendError.message ? sendError.message : String(sendError);
            console.warn('sendMessages 失敗，改由系統推播:', sendError);

          }

        }

        // 2) 手機送不出去（不是從聊天室開啟、沒有權限、LINE 回報錯誤）→ 由系統推播同一張卡片
        if (!sentToLine && result.reservationId) {

          try {

            const notice = await callGAS('sendBookingNotice', {
              idToken: lineIdToken,
              reservationId: result.reservationId
            });

            if (notice && notice.success) {
              sentToLine = true;
            } else {
              noticeError = (notice && notice.message) || noticeError || '通知未送出';
            }

          } catch (noticeErr) {

            noticeError = noticeErr.message || noticeError;

          }

        }

        renderSuccessMessage(result, sentToLine, noticeError);
        resetForm();

      } else {

        alert(
          result && result.message
            ? result.message
            : '預約失敗，請稍後再試。'
        );

        loadTimes();

      }

    } catch (error) {

      console.error('createReservation ERROR:', error);

      alert('系統發生錯誤：' + error.message);

    }

  }

  /* ==================================================
     顯示預約成功訊息
  ================================================== */

  function renderSuccessMessage(result, sentToLine, noticeError) {

    const isPackage = result.paymentType === '課程扣堂';

    const fee = isPackage
      ? '使用課程：已保留 1 堂，上完課才正式扣除（可預約剩餘 ' + (result.remainingSessions || 0) + ' 堂）'
      : formatMoney(result.price || 0);

    $('message').innerHTML =
      '<div class="success">' +

        '<div class="success-title">🎉 預約成功！</div>' +

        '<div class="reservation-id">' +
          escapeHtml(result.reservationId || '') +
        '</div>' +

        '<div class="success-info">' +
          successRow('日期', result.date || '') +
          successRow('時間', formatTime(result.time)) +
          successRow('課程', shortName(result.service || '')) +
          (result.coachName ? successRow('教練', result.coachName) : '') +
          (result.partnerName ? successRow('同行夥伴', result.partnerName) : '') +
          successRow('費用', fee) +
        '</div>' +

        '<div class="success-notice">' +
          (sentToLine
            ? '預約確認通知已傳送至您的 LINE。'
            : '預約已完成，期待與您見面。' +
              (noticeError ? '<br>（LINE 通知沒有送出：' + escapeHtml(noticeError) + '。可以在聊天室輸入「我的預約」查看。）' : '')) +
          (result.coachName ? '' : '教練會由工作室為您安排，確認後會再與您聯繫。') +
        '</div>' +

      '</div>';

    $('message').scrollIntoView({ behavior: 'smooth', block: 'center' });

  }

  function successRow(label, value) {

    return (
      '<div class="success-row">' +
        '<div class="success-label">' + escapeHtml(label) + '</div>' +
        '<div class="success-value">' + escapeHtml(value) + '</div>' +
      '</div>'
    );

  }

  /* ==================================================
     服務暫停畫面
  ================================================== */

  function showServiceDisabledOverlay() {

    $('bookView').innerHTML =
      '<div class="success">' +
        '<div class="success-title">🛠 服務暫停中</div>' +
        '<div class="success-notice">' +
          '目前線上預約暫停使用，請直接透過 LINE 官方帳號或電話與我們聯繫，造成不便敬請見諒。' +
        '</div>' +
      '</div>';

  }

  /* ==================================================
     重置表單
  ================================================== */

  function resetForm() {

    selectedTime = '';
    selectedDate = '';
    calendarViewDate = new Date();

    // 完成預約後，清掉快取並重新查詢當月可預約日期
    monthAvailabilityKey = '';
    Object.keys(monthCache).forEach(function (k) { delete monthCache[k]; });

    renderCalendar();
    updateSelectedDateLabel();

    $('times').innerHTML = '<div class="no-time">請先選擇日期</div>';

    // 已帶入會員資料的欄位不清掉
    if (!$('name').readOnly) $('name').value = '';
    if (!$('phone').readOnly) $('phone').value = '';
    $('partnerName').value = '';
    $('partnerPhone').value = '';
    $('studentNote').value = '';

    hideCoachChoices();

    // 預約後課程堂數、新生身分都可能變了，重新查一次
    lastIdKey = '';
    refreshMyStatus();

  }

  /* ==================================================
     HTML Escape
  ================================================== */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }

</script>
